<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculatrice</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:#0f1115; color:#e8e8ea; font-family:system-ui,sans-serif; }
  header { padding:10px 14px; background:#171a21; display:flex; gap:10px; align-items:center; justify-content:space-between; font-size:14px; flex-wrap:wrap; }
  header .st { color:#8b93a7; }
  header input { background:#0f1115; border:1px solid #2a2f3b; color:#e8e8ea; border-radius:8px; padding:6px 8px; width:130px; }
  header button { background:#2a2f3b; color:#e8e8ea; border:0; border-radius:8px; padding:6px 10px; cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .m { max-width:80%; padding:8px 12px; border-radius:14px; background:#222733; word-wrap:break-word; white-space:pre-wrap; }
  .m .n { font-size:11px; color:#8b93a7; display:block; margin-bottom:2px; }
  .m.me { align-self:flex-end; background:#2b5cff; }
  .m.me .n { color:#cdd8ff; }
  .sys { align-self:center; color:#6b7388; font-size:12px; text-align:center; }
  form { display:flex; gap:8px; padding:10px; background:#171a21; }
  form input { flex:1; background:#0f1115; border:1px solid #2a2f3b; color:#e8e8ea; border-radius:20px; padding:10px 14px; font-size:16px; outline:none; }
  form button { background:#2b5cff; color:#fff; border:0; border-radius:20px; padding:0 18px; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <span id="st" class="st">Connexion…</span>
  <span>
    <input id="name" maxlength="20" title="Ton pseudo">
    <input id="room" placeholder="salle manuelle" title="Optionnel : salle commune si l'auto-détection échoue">
    <button id="join">OK</button>
  </span>
</header>
<div id="log"></div>
<form id="f"><input id="t" autocomplete="off" placeholder="Message…"><button>Envoyer</button></form>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const log = $('log'), st = $('st');
  const enc = new TextEncoder(), dec = new TextDecoder();
  const myId = Math.random().toString(36).slice(2, 10);
  $('name').value = 'Anonyme-' + Math.floor(1000 + Math.random() * 9000);

  let client = null, rooms = [], peers = new Map(), seen = new Set(), hb = null, mode = '';

  const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const sha = async s => crypto.subtle.digest('SHA-256', enc.encode(s));

  function sys(t) { const d = document.createElement('div'); d.className = 'sys'; d.textContent = t; log.appendChild(d); log.scrollTop = log.scrollHeight; }
  function msg(name, text, me) {
    const d = document.createElement('div'); d.className = 'm' + (me ? ' me' : '');
    const n = document.createElement('span'); n.className = 'n'; n.textContent = name;
    d.appendChild(n); d.appendChild(document.createTextNode(text));
    log.appendChild(d); log.scrollTop = log.scrollHeight;
  }
  function status() {
    const n = [...peers.values()].filter(t => Date.now() - t < 25000).length;
    const codes = rooms.map(r => r.code).join(' / ');
    st.textContent = client && client.connected
      ? ('Actif · ' + (n + 1) + ' appareil(s) · ' + codes)
      : 'Déconnecté';
  }

  // Récupère une IP avec timeout
  async function getIp(url) {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 5000);
    try { const r = await fetch(url, { signal: ctl.signal }); const j = await r.json(); return j.ip || null; }
    catch (e) { return null; }
    finally { clearTimeout(to); }
  }
  // Préfixe /64 d'une IPv6 (commun à tous les appareils d'une même box)
  function prefix64(ip) {
    let [head, tail] = ip.split('::');
    const h = head ? head.split(':') : [];
    const t = tail !== undefined && tail ? tail.split(':') : [];
    const missing = 8 - h.length - t.length;
    const all = tail === undefined ? h : [...h, ...Array(Math.max(missing, 0)).fill('0'), ...t];
    return all.slice(0, 4).map(x => x.padStart(4, '0')).join(':');
  }
  async function getSecrets() {
    const [v4, v6] = await Promise.all([
      getIp('https://api.ipify.org?format=json'),
      getIp('https://api6.ipify.org?format=json')
    ]);
    const out = [];
    if (v4) out.push('ip4:' + v4);
    if (v6 && v6.includes(':')) out.push('ip6:' + prefix64(v6));
    return out;
  }

  async function makeRoom(secret) {
    const h = await sha('topic|' + secret);
    const topic = 'calc-chat/v1/' + hex(h).slice(0, 32);
    const code = hex(await sha('code|' + secret)).slice(0, 4);
    const key = await crypto.subtle.importKey('raw', await sha('key|' + secret), 'AES-GCM', false, ['encrypt', 'decrypt']);
    return { topic, key, code };
  }

  async function encrypt(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
    return b64(iv) + '.' + b64(ct);
  }
  async function decrypt(key, s) {
    const [iv, ct] = s.split('.');
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(iv) }, key, unb64(ct));
    return JSON.parse(dec.decode(pt));
  }
  async function send(obj) {
    if (!client || !client.connected) return;
    const body = { ...obj, id: myId, name: $('name').value || 'Anonyme' };
    for (const r of rooms) client.publish(r.topic, await encrypt(r.key, body));
  }

  async function start(manualRoom) {
    if (client) { clearInterval(hb); client.end(true); client = null; }
    peers.clear(); log.innerHTML = ''; rooms = [];
    st.textContent = 'Détection du réseau…';
    const secrets = manualRoom ? ['room:' + manualRoom] : await getSecrets();
    if (!secrets.length) {
      st.textContent = 'Réseau introuvable';
      sys('Impossible de détecter le wifi (bloqueur de pub / VPN ?). Entre une salle manuelle en haut.');
      return;
    }
    rooms = await Promise.all(secrets.map(makeRoom));

    client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', { clientId: 'cc_' + myId, reconnectPeriod: 3000 });
    client.on('connect', () => {
      client.subscribe(rooms.map(r => r.topic), () => { send({ type: 'hi' }); status(); });
      sys(manualRoom ? 'Salle manuelle : ' + manualRoom : 'Connecté. Si un autre appareil a le même code en haut, vous vous verrez.');
    });
    client.on('close', status);
    client.on('message', async (t, payload) => {
      const room = rooms.find(r => r.topic === t); if (!room) return;
      try {
        const m = await decrypt(room.key, payload.toString());
        if (m.id === myId) return;
        peers.set(m.id, Date.now());
        if (m.type === 'hi') send({ type: 'pong' });
        else if (m.type === 'chat') {
          const k = m.id + m.t; if (seen.has(k)) return; seen.add(k);
          msg(m.name, m.text, false);
        }
        status();
      } catch (e) {}
    });
    hb = setInterval(() => { send({ type: 'pong' }); status(); }, 10000);
  }

  $('f').addEventListener('submit', e => {
    e.preventDefault();
    const text = $('t').value.trim(); if (!text) return;
    send({ type: 'chat', text, t: Date.now() });
    msg($('name').value || 'Anonyme', text, true);
    $('t').value = '';
  });
  $('join').addEventListener('click', () => start($('room').value.trim() || null));
  start(null);
})();
</script>
</body>
</html>
